# Configuration de l'interface d'édition Pages CMS
# Chaque entrée ci-dessous devient un menu dans Pages CMS.

media:
  input: medias
  output: /medias
  categories: [image, document]

components:
  aide_mise_en_forme:
    type: text
    description: "Mise en forme possible : *italique* pour un titre de livre, **gras**, [texte du lien](https://adresse). Laisser une ligne vide pour un nouveau paragraphe."

content:
  - name: accueil
    label: Accueil
    type: file
    path: contenu/accueil.yml
    format: yaml
    fields:
      - { name: titre_google, label: "Titre affiché dans Google", type: string, description: "60 caractères environ" }
      - { name: description_google, label: "Description affichée dans Google", type: text, description: "150 caractères environ" }
      - { name: accroche, label: "Grande accroche", type: string }
      - { name: sous_titre_1, label: "Sous-titre, ligne 1", type: string }
      - { name: sous_titre_2, label: "Sous-titre, ligne 2", type: string }
      - { name: introduction, label: "Texte de présentation", component: aide_mise_en_forme }
      - { name: portrait, label: "Portrait", type: image }
      - { name: portrait_description, label: "Description du portrait (pour Google et les malvoyants)", type: string }
      - name: chiffres
        label: Chiffres clés
        type: object
        list: true
        fields:
          - { name: nombre, label: "Chiffre", type: string }
          - { name: texte, label: "Texte", type: string }
          - { name: texte_2, label: "Deuxième ligne (facultatif)", type: string }
      - { name: references_titre, label: "Titre des références", type: string }
      - { name: references_sous_titre, label: "Sous-titre des références", type: string }
      - { name: references, label: "Références (un nom par ligne)", type: string, list: true }
      - { name: conferences_titre, label: "Titre du bloc conférences", type: string }
      - { name: conferences_texte, label: "Texte du bloc conférences", component: aide_mise_en_forme }
      - name: citation_presse
        label: Citation de presse
        type: object
        fields:
          - { name: texte, label: "Citation (sans guillemets)", type: text }
          - { name: source, label: "Source", type: string }
      - { name: livres_titre, label: "Titre du bloc livres", type: string }
      - { name: livres_texte, label: "Texte du bloc livres", type: text }
      - name: livres_en_avant
        label: Livres mis en avant
        type: object
        list: true
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: etiquette, label: "Petite mention (ex. : Essai, 2021)", type: string }
          - { name: couverture, label: "Couverture", type: image }
          - { name: resume, label: "Résumé court", type: text }
          - { name: lien, label: "Lien vers la page du livre", type: string }
          - { name: lien_texte, label: "Texte du lien", type: string }
      - { name: appel_titre, label: "Bandeau final : titre", type: string }
      - { name: appel_texte, label: "Bandeau final : texte", type: text }
      - { name: appel_bouton, label: "Texte du bouton d'invitation", type: string }

  - name: conferences
    label: Conférences
    type: file
    path: contenu/conferences.yml
    format: yaml
    fields:
      - { name: titre_google, label: "Titre affiché dans Google", type: string }
      - { name: description_google, label: "Description affichée dans Google", type: text }
      - { name: bandeau_photo, label: "Photo du bandeau", type: image }
      - { name: bandeau_titre, label: "Titre du bandeau", type: string }
      - { name: bandeau_texte, label: "Texte du bandeau", type: text }
      - { name: approche_titre, label: "Titre de l'introduction", type: string }
      - { name: approche_texte, label: "Texte de l'introduction", component: aide_mise_en_forme }
      - name: liste
        label: Les conférences
        type: object
        list: true
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: ancre, label: "Identifiant court (sans espace ni accent)", type: string }
          - { name: phare, label: "Conférence phare ?", type: boolean }
          - { name: pour_qui, label: "Pour qui", type: string }
          - { name: description, label: "Description", component: aide_mise_en_forme }
          - { name: points_titre, label: "Titre de la liste (ex. : Le déroulé type)", type: string }
          - { name: points_numerotes, label: "Liste numérotée ?", type: boolean }
          - { name: points, label: "Points de la liste", type: string, list: true }
          - { name: benefices, label: "Ce que le public en retire", type: string, list: true }
          - { name: format, label: "Format", type: string }
      - { name: formats_titre, label: "Titre des formats", type: string }
      - name: formats
        label: Formats
        type: object
        list: true
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte", type: text }
      - name: infos_pratiques
        label: Informations pratiques
        type: object
        list: true
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte", type: text }
      - { name: galerie_titre, label: "Titre de la galerie", type: string }
      - name: galerie
        label: Galerie de photos
        type: object
        list: true
        fields:
          - { name: photo, label: "Photo", type: image }
          - { name: legende, label: "Légende", type: string }
          - { name: description, label: "Description (pour Google et les malvoyants)", type: string }
          - name: cadrage
            label: "Cadrage (photo verticale : choisir « haut »)"
            type: select
            options: { values: ["", "haut"] }
      - { name: video_titre, label: "Captation vidéo : titre", type: string }
      - { name: video_texte, label: "Captation vidéo : texte (facultatif)", type: text }
      - { name: video_lien, label: "Captation vidéo : lien YouTube (le bloc apparaît dès qu'il est rempli)", type: string }
      - { name: video_image, label: "Captation vidéo : image d'aperçu", type: image }
      - { name: medias_titre, label: "Titre vidéos et podcasts", type: string }
      - name: medias
        label: Vidéos et podcasts
        type: object
        list: true
        fields:
          - { name: type, label: "Type et média (ex. : Podcast - Nom)", type: string }
          - { name: titre, label: "Titre", type: string }
          - { name: accroche, label: "Phrase affichée si pas d'image", type: string }
          - { name: lien, label: "Lien (YouTube, etc.)", type: string }
          - { name: image, label: "Image (facultatif)", type: image }
      - { name: references_titre, label: "Titre des références", type: string }
      - { name: references_texte, label: "Texte des références", type: string }
      - name: references
        label: Références par public
        type: object
        list: true
        fields:
          - { name: categorie, label: "Catégorie", type: string }
          - name: lignes
            label: Références
            type: object
            list: true
            fields:
              - { name: nom, label: "Organisme", type: string }
              - { name: annee, label: "Année(s)", type: string }
      - { name: agence_texte, label: "Texte sur l'agence", component: aide_mise_en_forme }
      - { name: agence_bouton, label: "Texte du lien vers la fiche de l'agence", type: string }
      - { name: appel_titre, label: "Bandeau final : titre", type: string }
      - { name: appel_texte, label: "Bandeau final : texte", type: text }
      - { name: appel_bouton, label: "Texte du bouton", type: string }

  - name: livres
    label: Livres
    type: file
    path: contenu/livres.yml
    format: yaml
    fields:
      - { name: titre_google, label: "Titre affiché dans Google", type: string }
      - { name: description_google, label: "Description affichée dans Google", type: text }
      - { name: titre, label: "Titre de la page", type: string }
      - { name: introduction, label: "Introduction", component: aide_mise_en_forme }
      - { name: photo, label: "Photo de la page", type: image }
      - { name: photo_description, label: "Description de la photo", type: string }
      - name: photos_librairie
        label: Photos en librairie
        type: object
        list: true
        fields:
          - { name: photo, label: "Photo", type: image }
          - { name: description, label: "Description", type: string }
      - { name: lien_poemes, label: "Lien vers les poèmes non publiés", type: string }
      - name: livres
        label: Les livres (dans l'ordre d'affichage)
        type: object
        list: true
        fields:
          - { name: titre, label: "Titre", type: string, required: true }
          - { name: adresse, label: "Adresse de la page (minuscules, tirets, sans accent)", type: string, description: "ex. : la-pierre-interieure" }
          - name: genre
            label: Genre
            type: select
            options: { values: ["Roman philosophique", "Essai", "Roman", "Poésie"] }
          - { name: annee, label: "Année de parution", type: string }
          - { name: a_paraitre, label: "À paraître ?", type: boolean }
          - { name: mention, label: "Mention sous le titre (ex. : Roman, 2019)", type: string }
          - { name: editeur, label: "Éditeur", type: string }
          - { name: details, label: "Précisions (préface, collaboration…)", type: string }
          - { name: isbn, label: "ISBN (13 chiffres, sans tirets)", type: string }
          - { name: couverture, label: "Couverture", type: image }
          - { name: resume_court, label: "Résumé court (une phrase)", type: text }
          - { name: resume, label: "Résumé", component: aide_mise_en_forme }
          - { name: texte_complementaire, label: "Texte complémentaire (facultatif)", component: aide_mise_en_forme }
          - name: citations
            label: Citations de presse ou de jury
            type: object
            list: true
            fields:
              - { name: texte, label: "Citation (sans guillemets)", type: text }
              - { name: source, label: "Source", type: string }
          - name: avis
            label: Avis de lecteurs
            type: object
            list: true
            fields:
              - { name: texte, label: "Avis (sans guillemets)", type: text }
              - { name: auteur, label: "Auteur et site", type: string }
              - { name: lien, label: "Lien vers l'avis", type: string }
          - name: poemes
            label: Poèmes ou extraits
            type: object
            list: true
            fields:
              - { name: titre, label: "Titre", type: string }
              - { name: texte, label: "Texte (retours à la ligne conservés, ligne vide entre les strophes)", type: text }
          - name: liens
            label: Liens d'achat
            type: object
            list: true
            fields:
              - { name: libelle, label: "Texte du lien (ex. : Decitre)", type: string }
              - { name: url, label: "Adresse", type: string }
          - { name: page_detaillee, label: "Page dédiée pour ce livre ?", type: boolean }

  - name: apropos
    label: À propos
    type: file
    path: contenu/apropos.yml
    format: yaml
    fields:
      - { name: titre_google, label: "Titre affiché dans Google", type: string }
      - { name: description_google, label: "Description affichée dans Google", type: text }
      - { name: titre, label: "Titre de la page", type: string }
      - { name: chapeau, label: "Phrase d'introduction", type: text }
      - { name: photo, label: "Photo", type: image }
      - { name: photo_description, label: "Description de la photo", type: string }
      - name: chapitres
        label: Chapitres de la biographie
        type: object
        list: true
        fields:
          - { name: titre, label: "Titre", type: string }
          - { name: texte, label: "Texte", component: aide_mise_en_forme }
      - { name: reperes_titre, label: "Titre des repères", type: string }
      - name: reperes
        label: Repères chronologiques
        type: object
        list: true
        fields:
          - { name: annee, label: "Année", type: string }
          - { name: texte, label: "Événement", type: string }
      - { name: bio_courte_titre, label: "Titre de la bio courte", type: string }
      - { name: bio_courte_intro, label: "Introduction de la bio courte", type: string }
      - { name: bio_courte, label: "Bio courte", component: aide_mise_en_forme }
      - { name: credits_titre, label: "Titre des crédits", type: string }
      - name: credits
        label: Crédits
        type: object
        list: true
        fields:
          - { name: livre, label: "Livre ou élément crédité", type: string }
          - { name: auteur, label: "Crédit", type: string }
          - { name: oeuvre, label: "Titre d'œuvre (en italique) ?", type: boolean, default: true }

  - name: presse
    label: Presse
    type: file
    path: contenu/presse.yml
    format: yaml
    fields:
      - { name: titre_google, label: "Titre affiché dans Google", type: string }
      - { name: description_google, label: "Description affichée dans Google", type: text }
      - { name: titre, label: "Titre de la page", type: string }
      - { name: introduction, label: "Introduction", type: text }
      - name: citations
        label: Citations de presse
        type: object
        list: true
        fields:
          - { name: texte, label: "Citation (sans guillemets)", type: text }
          - { name: source, label: "Source", type: string }
      - { name: articles_titre, label: "Titre des articles", type: string }
      - name: articles
        label: Articles (du plus récent au plus ancien)
        type: object
        list: true
        fields:
          - { name: media, label: "Média", type: string }
          - { name: titre, label: "Titre ou sujet", type: string }
          - { name: date, label: "Date", type: string }
          - { name: lien, label: "Lien (facultatif)", type: string }
      - { name: ecouter_titre, label: "Titre vidéos et podcasts", type: string }
      - name: ecouter
        label: Vidéos et podcasts
        type: object
        list: true
        fields:
          - { name: media, label: "Média", type: string }
          - { name: titre, label: "Titre", type: string }
          - { name: date, label: "Date", type: string }
          - { name: lien, label: "Lien", type: string }
      - { name: journalistes_titre, label: "Titre espace journalistes", type: string }
      - { name: journalistes_texte, label: "Texte espace journalistes", component: aide_mise_en_forme }
      - name: photos_hd
        label: Photos téléchargeables
        type: object
        list: true
        fields:
          - { name: photo, label: "Photo", type: image }
          - { name: description, label: "Description", type: string }

  - name: contact
    label: Contact
    type: file
    path: contenu/contact.yml
    format: yaml
    fields:
      - { name: titre_google, label: "Titre affiché dans Google", type: string }
      - { name: description_google, label: "Description affichée dans Google", type: text }
      - { name: titre, label: "Titre de la page", type: string }
      - { name: introduction, label: "Introduction", type: text }
      - { name: conseils_titre, label: "Titre des conseils", type: string }
      - { name: conseils, label: "Conseils", type: string, list: true }
      - { name: formulaire_tally, label: "Adresse du formulaire Tally", type: string, description: "ex. : https://tally.so/r/abc123" }
      - { name: direct_texte, label: "Phrase pour le contact direct", type: string }

  - name: mentions
    label: Mentions légales
    type: file
    path: contenu/mentions.yml
    format: yaml
    fields:
      - { name: societe, label: "Société", type: string }
      - { name: forme, label: "Forme juridique", type: string }
      - { name: capital, label: "Capital", type: string }
      - { name: rcs_ville, label: "Ville du RCS", type: string }
      - { name: siren, label: "SIREN", type: string }
      - { name: siret, label: "SIRET", type: string }
      - { name: adresse, label: "Adresse du siège", type: string }
      - { name: directeur, label: "Directeur de la publication", type: string }
      - { name: hebergeur, label: "Hébergeur", type: text }

  - name: temoignages
    label: Témoignages
    type: file
    path: contenu/temoignages.yml
    format: yaml
    fields:
      - name: temoignages
        label: Témoignages d'organisateurs
        type: object
        list: true
        fields:
          - { name: nom, label: "Nom", type: string }
          - { name: fonction, label: "Fonction et organisme", type: string }
          - { name: version_courte, label: "Version courte (accueil)", type: text }
          - { name: texte, label: "Version complète (page Conférences)", component: aide_mise_en_forme }

  - name: reglages
    label: Réglages du site
    type: file
    path: contenu/site.yml
    format: yaml
    fields:
      - { name: nom, label: "Nom du site", type: string }
      - { name: email, label: "Adresse e-mail", type: string }
      - { name: linkedin, label: "Lien LinkedIn", type: string }
      - { name: instagram, label: "Lien Instagram", type: string }
      - { name: babelio, label: "Lien Babelio", type: string }
      - { name: agence_nom, label: "Nom de l'agence", type: string }
      - { name: agence_lien, label: "Lien vers la fiche de l'agence", type: string }
      - { name: bouton_invitation, label: "Texte du bouton du menu", type: string }
      - { name: lien_formulaire, label: "Lien du bouton d'invitation", type: string }
      - { name: metier, label: "Métier (affiché par Google)", type: string }
