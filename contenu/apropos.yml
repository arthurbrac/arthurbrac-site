bio_courte_titre: Pour les organisateurs
bio_courte_intro: "Une présentation courte, rédigée à la troisième personne, à reprendre librement dans un programme ou une invitation :"
bio_courte: >-
  Arthur Brac de la Perrière est entrepreneur, écrivain et conférencier. Diplômé
  d'HEC, il quitte le monde des multinationales pour devenir artisan, puis
  développe pendant 13 ans meTiista, entreprise lyonnaise de rénovation devenue
  société à mission. Auteur de sept livres, dont *L'entrepreneur philosophe* (2021),
  il intervient auprès des dirigeants, des réseaux d'entrepreneurs et des écoles
  sur ce que la philosophie apporte à l'action.

