# Textes de la page À propos (modifiables dans Pages CMS > À propos)
titre_google: À propos - Arthur Brac de la Perrière, chef d'entreprise écrivain
description_google: >-
  De HEC à l'artisanat, de meTiista à l'écriture : le parcours d'Arthur Brac de la
  Perrière, chef d'entreprise, écrivain et conférencier lyonnais.
titre: Biographie
chapeau: "Diplômé d'HEC, artisan, chef d'entreprise, écrivain : un parcours guidé par le besoin de donner du sens à l'action."
photo: /medias/portraits/arthur-jardin.jpg
photo_description: Arthur Brac de la Perrière, un livre à la main, dans un jardin à Lyon

chapitres:
  - titre: Du confort à l'engagement
    texte: >-
      Lyonnais, passé par la prépa au Parc puis HEC, j'ai commencé par le conseil en
      stratégie à Paris, un groupe de luxe à Londres, un tour du monde et des
      missions en ONG. Je suis ensuite entré dans un grand groupe de
      banque-assurance. Sécurité, perspectives : tout y était, sauf le sens. J'ai
      décidé de devenir entrepreneur pour trouver du sens dans l'action.
  - titre: Le choix du chantier
    texte: >-
      En 2009, je suis devenu ouvrier plaquiste-peintre non qualifié, pendant 7 mois,
      avec l'idée de me spécialiser dans la rénovation énergétique. En 2011, j'ai
      repris une petite entreprise artisanale. Elle deviendra meTiista. 12 ans plus
      tard, elle compte une quarantaine de personnes, 4,7 M€ de chiffre d'affaires,
      et le statut de société à mission. Je l'ai dirigée jusqu'en 2024, avant de
      prendre la direction de Dorémi, entreprise sociale et solidaire spécialisée dans la
      rénovation énergétique.
  - titre: L'écriture
    texte: >-
      Poète voyageur à mes débuts (*Les Rimes du monde*, *L'Asie centrale
      poétique*), puis romancier (*La pieuvre de Lhassa*, *La pierre intérieure*,
      prix littéraire ARAL 2020), je publie un roman philosophique fin 2026,
      *Rhapsodie pour une humanité*, aux éditions Les Passionnés de Bouquins.
  - titre: La philosophie comme boîte à outils
    texte: >-
      J'aime étudier la philosophie et l'utiliser à la manière des Anciens : comme
      un exercice, pas comme une théorie. Les stoïciens pour encaisser les coups
      durs, Simone Weil pour humaniser le travail, Spinoza pour trouver la joie.
      *L'entrepreneur philosophe* (2021) raconte cette expérience. Depuis, j'ai donné
      une trentaine de conférences : CJD, Rotary, CAPEB, Réseau Entreprendre, HEC, INSA.
  - titre: L'engagement
    texte: >-
      Administrateur du Réseau Entreprendre Rhône et d'autres sociétés,
      j'accompagne des entrepreneurs et des projets à impact social et écologique.
      Je vis à Lyon, je suis marié et père de quatre enfants.

