# Textes de la page À propos (modifiables dans Pages CMS > À propos)
titre_google: À propos - Arthur Brac de la Perrière, chef d'entreprise écrivain
description_google: >-
  De HEC à l'artisanat, de meTiista à l'écriture : le parcours d'Arthur Brac de la
  Perrière, chef d'entreprise, écrivain et conférencier lyonnais.
titre: Biographie
chapeau: "Diplômé d'HEC, artisan, chef d'entreprise, écrivain : un parcours guidé par le besoin de donner du sens à l'action."
photo: /medias/portraits/arthur-jardin.jpg
photo_description: Arthur Brac de la Perrière, un livre à la main, dans un jardin à Lyon

chapitres:
  - titre: Du confort à l'engagement
    texte: >-
      Lyonnais, passé par la prépa au Parc puis HEC, Arthur Brac de la Perrière
      commence par le conseil en stratégie à Paris, un groupe de luxe à Londres, un
      tour du monde et des missions en ONG. Il entre ensuite dans un grand groupe de
      banque-assurance. Sécurité, perspectives : tout y est, sauf le sens. Il décide
      de devenir entrepreneur pour trouver du sens dans l'action.
  - titre: Le choix du chantier
    texte: >-
      En 2009, il devient ouvrier plaquiste-peintre non qualifié, pendant 7 mois,
      avec l'idée de se spécialiser dans la rénovation énergétique. En 2011, il
      reprend une petite entreprise artisanale. Elle deviendra meTiista. 12 ans plus
      tard, elle compte une quarantaine de personnes, 4,7 M€ de chiffre d'affaires,
      et le statut de société à mission. Il la dirige jusqu'en 2024, puis prend la
      direction de Dorémi, entreprise sociale et solidaire spécialisée dans la
      rénovation énergétique.
  - titre: L'écriture
    texte: >-
      Poète voyageur à ses débuts (*Les Rimes du monde*, *L'Asie centrale
      poétique*), puis romancier (*La pieuvre de Lhassa*, *La pierre intérieure*,
      prix littéraire ARAL 2020), il publie un roman philosophique fin 2026,
      *Rhapsodie pour une humanité*, aux éditions Les Passionnés de Bouquins.
  - titre: La philosophie comme boîte à outils
    texte: >-
      Il aime étudier la philosophie et l'utiliser à la manière des Anciens : comme
      un exercice, pas comme une théorie. Les stoïciens pour encaisser les coups
      durs, Simone Weil pour humaniser le travail, Spinoza pour trouver la joie.
      *L'entrepreneur philosophe* (2021) raconte cette expérience. Depuis, il a donné
      une trentaine de conférences : CJD, Rotary, CAPEB, Réseau Entreprendre, HEC, INSA.
  - titre: L'engagement
    texte: >-
      Administrateur du Réseau Entreprendre Rhône et d'autres sociétés, il accompagne
      des entrepreneurs et des projets à impact social et écologique. Il vit à Lyon,
      marié et père de quatre enfants.

