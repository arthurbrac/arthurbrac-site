# Textes de la page d'accueil (modifiables dans Pages CMS > Accueil)
titre_google: Arthur Brac de la Perrière - Conférencier philosophie et entreprise, Lyon
description_google: >-
  Chef d'entreprise, écrivain et conférencier à Lyon, Arthur Brac de la Perrière
  intervient auprès des dirigeants et des équipes : philosophie et entreprise,
  sens au travail, entrepreneuriat.

accroche: Un entrepreneur qui pense avec la philosophie
sous_titre_1: Arthur Brac de la Perrière
sous_titre_2: Chef d'entreprise, écrivain et conférencier à Lyon
introduction: >-
  Diplômé d'HEC, il quitte le monde des multinationales pour devenir artisan
  plaquiste-peintre, puis développe pendant 13 ans sa société meTiista,
  entreprise lyonnaise de rénovation devenue société à mission avec
  40 collaborateurs. Auteur de *L'entrepreneur philosophe*, il intervient
  auprès des dirigeants, des réseaux d'entrepreneurs et des écoles sur ce que
  la philosophie apporte à l'action.
portrait: /medias/portraits/arthur-lunettes-nb.jpg
portrait_description: Portrait en noir et blanc d'Arthur Brac de la Perrière, la main sur ses lunettes

chiffres:
  - nombre: 15 ans
