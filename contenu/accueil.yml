conferences_titre: Des conférences qui relient l'expérience et la pensée
conferences_texte: >-
  « Beaucoup de philosophes parlent de l'entreprise, mais peu d'entrepreneurs
  parlent de philo. » Arthur part de situations vécues à la tête d'une PME pour
  montrer ce que les grands penseurs apportent aux décisions de tous les jours.

citation_presse:
  texte: On referme ces pages avec une vision remarquablement concrète du métier d'entrepreneur… et une réelle dose de compassion.
  source: "*Les Échos*, Gabriel Grésillon, à propos de *L'entrepreneur philosophe*"

