livres:
  - titre: Rhapsodie pour une humanité
    adresse: rhapsodie-pour-une-humanite
    genre: Roman philosophique
    annee: "2026"
    a_paraitre: true
    mention: Sortie en décembre 2026
    editeur: Les Passionnés de Bouquins
    details: ""
    isbn: ""
    couverture: /medias/couvertures/rhapsodie-pour-une-humanite.jpg
    resume_court: "Un roman philosophique à Lyon : une professeure d'histoire, un élève poète, une doctorante et un musicien fondent un collectif pour rendre l'avenir désirable."
    resume: |-
      Hannah est une jeune professeure d'histoire. Elle rencontre Albert, élève de terminale, redoublant, poète et lecteur passionné. Entre eux, tout commence par un désaccord. Ils discutent, se disputent, se répondent. D'une querelle entre morale et mémoire naît une question qui ne les lâchera plus : comment lire le monde, et comment comprendre l'humain ?

      Bientôt, ils ne sont plus deux. Frédéric, musicien, et Simone, doctorante en philosophie, s'invitent dans leurs débats. L'alchimie transforme leurs conversations en un projet : les quatre amis fondent un collectif pour influer sur la société.

      Esprit de résistance, éveil à la vulnérabilité, soif de liberté, pouvoir des symboles et amour défendu… Au fil de leur aventure, une question se pose au lecteur : que sommes-nous prêts à faire, ici et maintenant, pour rendre l'avenir désirable ?
    texte_complementaire: |-
      Le roman se déroule à Lyon, de nos jours. Ses quatre personnages principaux, Hannah, Albert, Simone et Frédéric, sont inspirés de quatre penseurs des XIXe et XXe siècles : Hannah Arendt, Albert Camus, Simone Weil et Friedrich Nietzsche. Le roman s'inspire librement de ces figures, sans prétendre interpréter leur pensée ni éclairer leur œuvre. Il imagine plutôt ce que pourraient être leurs héritiers du XXIe siècle, réunis par le hasard pour réfléchir ensemble et agir sur le monde.
