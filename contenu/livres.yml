  - titre: L'entrepreneur philosophe
    adresse: l-entrepreneur-philosophe
    genre: Essai
    annee: "2021"
    a_paraitre: false
    mention: Essai, 2021
    editeur: Les Passionnés de Bouquins
    details: Préfaces de Sabine Basili et Emmanuel Gabellieri
    isbn: "9782363511171"
    couverture: /medias/couvertures/l-entrepreneur-philosophe.jpg
    resume_court: Le quotidien d'un patron de PME, avec la philosophie comme boîte à outils pour penser et agir. Le livre à l'origine des conférences.
    resume: >-
      L'entreprise et la philosophie. Deux mondes a priori opposés. Et pourtant,
      fort de mon expérience de dirigeant, je propose des passerelles entre ces
      deux univers. Dans mon quotidien de patron de PME, j'utilise la philosophie et ses concepts comme une véritable boîte à outils pour
      faire de l'entrepreneuriat une matière permettant de penser et agir. Ce livre
      témoignage, fondé sur des exemples concrets, propose des ressources originales
      pour l'entreprise.
    texte_complementaire: >-
      Ce livre est à l'origine de mes conférences : j'y raconte les litiges,
      les conflits, les crises de croissance et les choix difficiles d'une PME du
      bâtiment, et ce que Spinoza, Leibniz, Sartre, les stoïciens ou les épicuriens
      m'ont appris pour les traverser.
    citations:
      - texte: On referme ces pages avec une vision remarquablement concrète du métier d'entrepreneur… et une réelle dose de compassion. Un regard singulier et stimulant.
        source: "*Les Échos*, Gabriel Grésillon"
      - texte: Humour, érudition, pertinence du regard sur la vie d'une entreprise.
        source: "*Le Progrès*, Sylvie Silvestre"
    avis:
      - texte: On m'a offert ce livre que j'ai dévoré ! Passionnant récit sur le quotidien d'un chef d'entreprise artisanale… avec ses réflexions philosophiques qui l'aident à prendre de la hauteur. Un ouvrage de référence, pour les entrepreneurs, comme pour les employés et les clients ! Je l'ai racheté pour l'offrir à d'autres !
        auteur: Fred P., lecteur sur Decitre
        lien: https://www.decitre.fr/livres/l-entrepreneur-philosophe-9782363511171.html
    poemes: []
    liens:
