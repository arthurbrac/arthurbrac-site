  - titre: L'Asie centrale poétique. Prose et vers
    adresse: l-asie-centrale-poetique
    genre: Poésie
    annee: "2012"
    a_paraitre: false
    mention: Carnet de voyage en poèmes, 2012
    editeur: BoD
    details: Avec la collaboration de Sabine Bord et Marc Lasserre
    isbn: "9782810613922"
    couverture: /medias/couvertures/l-asie-centrale-poetique.jpg
    resume_court: Carnet de voyage en poèmes à travers l'Asie centrale.
    resume: Carnet de voyage en poèmes à travers l'Asie centrale, du Kirghizstan à l'Ouzbékistan, de la mer d'Aral à Samarkand.
    texte_complementaire: ""
    citations: []
    avis: []
    poemes:
      - titre: Mer d'Aral
        texte: |-
          J'ai marché sur les fonds marins
          sous un soleil lourd de chagrin
          dans des miettes de coquillages
          aux parfums des anciens sillages.

          J'ai vu sur le port des bateaux mourir de sable
          en pleurant à jamais une mère ineffable
          j'ai vu le sel et la soif de la mer d'Aral,
          dans la poussière aride d'une grande barrière de rocaille.

          J'ai vu un vieux fleuve étranglé
          derrière l'estuaire délavé
          j'ai su au désert amarré
          qu'il n'y aurait plus qu'une marée.
      - titre: La pêche
        texte: |-
          Le soleil s'est jeté dans la rivière
          là où les eaux s'allongent.

          Un enfant s'assied sur des nuages d'ombres
          et transperce le temps d'un fil de soie
          jeté dans les flots sereins et opaques.

          Au-dessus des gouttelettes mélodieuses,
          les astres ne bougent plus.

          Des ondes fabriquent les secondes d'eau
          d'une horloge suspendue
          aux profondeurs des courants intérieurs.
      - titre: L'heure d'été
        texte: |-
          Voyage arrête-toi
          et laisse goûter ce thé sur mes lèvres.
          Ne me quitte pas
          et remplis mes yeux de tes histoires.

          Ne m'abandonne pas,
          reste encore un peu,
          le temps que j'oublie
          que j'ai été cet homme.

          Le temps que j'oublie
          les murs de ma vie,
          l'usure de mes couloirs
          et l'heure de mon sommeil.
    liens:
      - libelle: Fnac
        url: https://www.fnac.com/a4759657/Arthur-Brac-de-la-Perriere-L-Asie-centrale-poetique
    page_detaillee: false

  - titre: Les Rimes du monde
    adresse: les-rimes-du-monde
    genre: Poésie
    annee: "2003"
    a_paraitre: false
    mention: Poésie, 2003
    editeur: Lettres du Monde
    details: ""
    isbn: ""
    couverture: /medias/couvertures/les-rimes-du-monde.jpg
    resume_court: Un carnet de voyage en poèmes sur trois continents.
    resume: >-
      Un carnet de voyage en poèmes à travers l'Asie, l'Afrique et l'Amérique du
      Sud. Au fil de missions solidaires, de Manille à la Côte d'Ivoire en passant
      par la Thaïlande, les vers disent l'émerveillement, la révolte et l'espoir, à
      la rencontre des femmes et des hommes.
    texte_complementaire: ""
    citations: []
    avis: []
    poemes:
      - titre: Instants
        texte: |-
          Que deviendront demain ces improbables instants
          Quand de ma mémoire ils iront s'évaporant ?
          Car sans fin, les instants de ma mémoire s'échangent
          Pour regagner très doucement la part des anges.

          Je traverse ces instants dont me dépouille le temps,
          Qu'ils me traversent, qu'ils me traversent encore longtemps.
          Que les instants me piquent et s'en aillent, que je change !
          Un jour je m'y noierai en gagnant ma part d'ange.
      - titre: Les offrandes de la nuit
        texte: |-
          Dansez tristesses,
          Souriez princesses,
          Votre beauté est précieuse,
          Vous qui êtes si pieuses
          De ces rudes caresses
          Aux séductions de paresse.

          Et qu'est-ce qu'une pièce d'or
          Pour une jeunesse indolore,
          Une fesse rafraîchie,
          Un sexe d'oubli,
          Un baiser d'indifférence
          Sur un lit sans romance.

          Un lendemain de filles de destin,
          La décadence
          Des femmes d'élégance,
          Et pour Bouddha quelques fruits,
          Les offrandes de la nuit.
    liens:
      - libelle: Avis des lecteurs sur Fnac
        url: https://www.fnac.com/a1509171/Arthur-Brac-de-la-Perriere-Les-rimes-du-monde
    page_detaillee: false
